version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: parcelnode-postgres
    restart: always
    environment:
      POSTGRES_USER: parcelnode
      POSTGRES_PASSWORD: parcelnode_secret
      POSTGRES_DB: parcelnode_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelnode -d parcelnode_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: parcelnode-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  hardhat:
    image: node:20-alpine
    container_name: parcelnode-hardhat
    working_dir: /app
    volumes:
      - ./contracts:/app
    command: npx hardhat node --hostname 0.0.0.0
    ports:
      - "8545:8545"

volumes:
  postgres_data:
